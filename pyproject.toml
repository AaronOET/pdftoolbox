[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfgears"
version = "0.1.0"
authors = [
    { name = "aaronchh", email = "aaronhsu219@gmail.com" },
]
description = "A collection of tools for working with PDF files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "pypdf>=3.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AaronOET/pdftoolbox"

[tool.setuptools]
packages = ["pdfgears"]

[project.scripts]
pdfgears = "pdfgears.cli:main"
pdfgears-info = "pdfgears.describe:main"
rmbmk = "pdfgears.rmbmk:main"
